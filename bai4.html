<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 4 - Mô phỏng đăng nhập</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f1f5f9; color: #172033; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 440px); padding: 32px; background: white; border-radius: 16px; box-shadow: 0 12px 36px #17203314; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 24px; color: #526078; }
    label { display: block; margin: 16px 0 8px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    output { display: block; margin-top: 20px; font-weight: 600; }
    .error { color: #b91c1c; }
    .success { color: #15803d; }
  </style>
</head>
<body>
  <main>
    <h1>Bài 4: Mô phỏng đăng nhập</h1>
    <p>Tài khoản mẫu: <strong>admin</strong> / <strong>123456</strong>.</p>
    <form id="login-form">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" type="text" required autocomplete="username">
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="submit">Đăng nhập</button>
    </form>
    <output id="result" aria-live="polite"></output>
  </main>
  <script>
    const username = "admin";
    const password = "123456";
    const loginForm = document.querySelector("#login-form");
    const loginResult = document.querySelector("#result");
    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const enteredUsername = document.querySelector("#username").value;
      const enteredPassword = document.querySelector("#password").value;
      if (enteredUsername === username && enteredPassword === password) {
        loginResult.textContent = "Đăng nhập thành công";
        loginResult.className = "success";
      } else {
        loginResult.textContent = "Thông tin không chính xác";
        loginResult.className = "error";
      }
    });
  </script>
</body>
</html>
