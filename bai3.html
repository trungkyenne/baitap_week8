<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3 - Tính chỉ số BMI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f1f5f9; color: #172033; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 440px); padding: 32px; background: white; border-radius: 16px; box-shadow: 0 12px 36px #17203314; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 24px; color: #526078; }
    label { display: block; margin: 16px 0 8px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    output { display: block; margin-top: 20px; font-weight: 600; }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>Bài 3: Tính chỉ số BMI</h1>
    <p>Công thức: BMI = cân nặng (kg) / chiều cao² (m).</p>
    <form id="bmi-form">
      <label for="height">Chiều cao (m)</label>
      <input id="height" name="height" type="number" min="0" step="any" required placeholder="Ví dụ: 1.7">
      <label for="weight">Cân nặng (kg)</label>
      <input id="weight" name="weight" type="number" min="0" step="any" required placeholder="Ví dụ: 65">
      <button type="submit">Tính BMI</button>
    </form>
    <output id="result" aria-live="polite"></output>
  </main>
  <script>
    const bmiForm = document.querySelector("#bmi-form");
    const bmiResult = document.querySelector("#result");
    bmiForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const height = Number(document.querySelector("#height").value);
      const weight = Number(document.querySelector("#weight").value);
      if (!Number.isFinite(height) || !Number.isFinite(weight) || height <= 0 || weight <= 0) {
        bmiResult.textContent = "Vui lòng nhập chiều cao và cân nặng lớn hơn 0.";
        bmiResult.className = "error";
        return;
      }
      const bmi = weight / (height * height);
      bmiResult.textContent = `Chỉ số BMI của bạn là ${bmi.toFixed(2)}.`;
      bmiResult.className = "";
    });
  </script>
</body>
</html>
